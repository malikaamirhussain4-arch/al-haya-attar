<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Al Haya Attar & Perfumes</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* Premium Luxury Dark Theme */
    body {
      background-color: #0d0d0d;
      color: #e5e5e5;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #141414;
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid #d4af37;
    }
    h1 {
      color: #d4af37;
      letter-spacing: 2px;
      margin: 0;
    }
    .container {
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 20px;
    }
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 25px;
    }
    .product-card {
      background-color: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      overflow: hidden;
      transition: transform 0.3s, border-color 0.3s;
    }
    .product-card:hover {
      transform: translateY(-5px);
      border-color: #d4af37;
    }
    .product-card img {
      width: 100%;
      height: 250px;
      object-fit: cover;
    }
    .product-info {
      padding: 15px;
    }
    .product-title {
      font-size: 1.2rem;
      color: #fff;
      margin: 0 0 10px 0;
    }
    .product-price {
      color: #d4af37;
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 15px;
    }
    .buy-btn {
      width: 100%;
      background-color: #d4af37;
      color: #000;
      border: none;
      padding: 10px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
    }
    .buy-btn:hover {
      background-color: #f3e5ab;
    }
  </style>
</head>
<body>

  <header>
    <h1>AL HAYA ATTAR AND PERFUMES</h1>
  </header>

  <div class="container">
    <h2 style="color: #d4af37; border-bottom: 1px solid #333; padding-bottom: 10px;">Our Premium Collection</h2>
    <div id="product-container" class="product-grid">
      <p>Loading luxury collection...</p>
    </div>
  </div>

  <script>
    // Supabase Initialization
    const SUPABASE_URL = 'https://bwhylxhjydrqrtwdbwjl.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_sZUbqMo7XUmOdd61adkI1Q_Cix4DNjq'; // Apni Publishable Key yahan paste karein

    const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function fetchProducts() {
      const container = document.getElementById('product-container');
      const { data: products, error } = await client.from('products').select('*');

      if (error) {
        container.innerHTML = '<p>Error loading products.</p>';
        console.error(error);
        return;
      }

      container.innerHTML = products.map(product => `
        <div class="product-card">
          <img src="${product.image_url}" alt="${product.name}">
          <div class="product-info">
            <h3 class="product-title">${product.name}</h3>
            <div class="product-price">₹${product.price}</div>
            <button class="buy-btn">Order Now</button>
          </div>
        </div>
      `).join('');
    }

    fetchProducts();
  </script>

</body>
</html>
