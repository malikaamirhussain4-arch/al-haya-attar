<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Al Haya Attar & Perfumes | Luxury Fragrance Collection</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-dark: #0a0a0a;
      --card-bg: #141414;
      --accent-gold: #d4af37;
      --accent-gold-hover: #f3e5ab;
      --text-light: #f5f5f5;
      --text-muted: #a0a0a0;
      --border-color: #262626;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-light);
      font-family: 'Cinzel', 'Playfair Display', 'Segoe UI', serif;
      line-height: 1.6;
    }

    /* Header & Navigation */
    header {
      background-color: rgba(10, 10, 10, 0.95);
      border-bottom: 1px solid var(--accent-gold);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(10px);
    }

    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-title {
      font-size: 1.6rem;
      color: var(--accent-gold);
      letter-spacing: 3px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .nav-actions {
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .cart-btn {
      background: transparent;
      border: 1px solid var(--accent-gold);
      color: var(--accent-gold);
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: bold;
      transition: all 0.3s;
    }

    .cart-btn:hover {
      background: var(--accent-gold);
      color: #000;
    }

    /* Hero Banner */
    .hero {
      text-align: center;
      padding: 60px 20px 40px;
      border-bottom: 1px solid var(--border-color);
      background: linear-gradient(180deg, #121212 0%, var(--bg-dark) 100%);
    }

    .hero h2 {
      font-size: 2.5rem;
      color: var(--accent-gold);
      margin-bottom: 10px;
    }

    .hero p {
      color: var(--text-muted);
      font-size: 1.1rem;
      max-width: 600px;
      margin: 0 auto;
    }

    /* Main Content */
    .container {
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 20px;
    }

    /* Filters */
    .filter-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
      margin-bottom: 30px;
    }

    .category-tabs {
      display: flex;
      gap: 10px;
      overflow-x: auto;
    }

    .tab-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-light);
      padding: 8px 18px;
      border-radius: 20px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.3s;
    }

    .tab-btn.active, .tab-btn:hover {
      border-color: var(--accent-gold);
      color: var(--accent-gold);
    }

    /* Product Grid */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 30px;
    }

    .product-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
    }

    .product-card:hover {
      transform: translateY(-6px);
      border-color: var(--accent-gold);
      box-shadow: 0 10px 20px rgba(212, 175, 55, 0.15);
    }

    .product-img-wrapper {
      position: relative;
      height: 280px;
      overflow: hidden;
    }

    .product-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .product-card:hover img {
      transform: scale(1.05);
    }

    .badge {
      position: absolute;
      top: 12px;
      left: 12px;
      background: var(--accent-gold);
      color: #000;
      font-size: 0.75rem;
      font-weight: bold;
      padding: 4px 10px;
      border-radius: 3px;
      text-transform: uppercase;
    }

    .product-info {
      padding: 20px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .product-title {
      font-size: 1.2rem;
      color: #fff;
      margin-bottom: 8px;
    }

    .product-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 15px;
      flex-grow: 1;
    }

    .product-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: auto;
    }

    .product-price {
      color: var(--accent-gold);
      font-size: 1.25rem;
      font-weight: bold;
    }

    .buy-btn {
      background-color: var(--accent-gold);
      color: #000;
      border: none;
      padding: 10px 18px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .buy-btn:hover {
      background-color: var(--accent-gold-hover);
    }

    /* Footer */
    footer {
      border-top: 1px solid var(--border-color);
      text-align: center;
      padding: 30px 20px;
      margin-top: 60px;
      color: var(--text-muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="nav-container">
      <div class="brand-title">Al Haya Attar</div>
      <div class="nav-actions">
        <button class="cart-btn" onclick="alert('Cart feature coming in next step!')">
          <i class="fa-solid fa-bag-shopping"></i> Cart (0)
        </button>
      </div>
    </div>
  </header>

  <section class="hero">
    <h2>Essence of Pure Luxury</h2>
    <p>Discover our exclusive selection of artisanal concentrated attars and royal perfumes.</p>
  </section>

  <div class="container">
    <div class="filter-bar">
      <div class="category-tabs">
        <button class="tab-btn active">All Collections</button>
        <button class="tab-btn">Royal Attars</button>
        <button class="tab-btn">Luxury Perfumes</button>
        <button class="tab-btn">Musk Collection</button>
      </div>
    </div>

    <div id="product-container" class="product-grid">
      <p style="color: var(--text-muted);">Loading luxury collection...</p>
    </div>
  </div>

  <footer>
    <p>&copy; 2026 Al Haya Attar & Perfumes. All Rights Reserved. Hosted on Shifa Labs.</p>
  </footer>

  <script>
    const SUPABASE_URL = 'https://bwhylxhjydrqrtwdbwjl.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_sZUbqMo7XUmOdd61adkI1Q_Cix4DNjq';

    const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function fetchProducts() {
      const container = document.getElementById('product-container');
      const { data: products, error } = await client.from('products').select('*');

      if (error) {
        container.innerHTML = '<p style="color: red;">Error loading products.</p>';
        console.error(error);
        return;
      }

      container.innerHTML = products.map(product => `
        <div class="product-card">
          <div class="product-img-wrapper">
            ${product.is_bestseller ? '<span class="badge">Bestseller</span>' : ''}
            <img src="${product.image_url}" alt="${product.name}">
          </div>
          <div class="product-info">
            <h3 class="product-title">${product.name}</h3>
            <p class="product-desc">${product.description || 'Exclusive long-lasting luxury fragrance.'}</p>
            <div class="product-bottom">
              <div class="product-price">₹${product.price}</div>
              <button class="buy-btn" onclick="orderWhatsApp('${product.name}', ${product.price})">Order Now</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function orderWhatsApp(name, price) {
      const message = `Hello Al Haya Attar, I want to order: ${name} (₹${price})`;
      const encodedMsg = encodeURIComponent(message);
      window.open(`https://wa.me/?text=${encodedMsg}`, '_blank');
    }

    fetchProducts();
  </script>

</body>
</html>
